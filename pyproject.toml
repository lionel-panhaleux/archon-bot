[build-system]
requires = ["uv_build>=0.7.19,<0.8"]
build-backend = "uv_build"

[project]
name = "archon-bot"
version = "2.10"
authors = [
    { name = "Lionel Panhaleux", email = "lionel.panhaleux+krcg@gmail.com" },
]
description = "Discord bot for VTES tournaments"
keywords = ["vampire", "vtes", "ccg", "discord", "bot"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Environment :: Plugins",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "aiohttp",
    "asgiref",
    "chardet",
    "krcg >= 4.1",
    "hikari >= 2.0.0.dev122",
    "orjson >= 3.9.10",
    "psycopg[pool] >= 3.1.13",
    "stringcase",
    "unidecode",
]

[project.scripts]
archon-bot = "archon_bot:main"

[project.urls]
Repository = "https://github.com/lionel-panhaleux/archon-bot"

[dependency-groups]
dev = [
    "ipdb",
    "ipython",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
